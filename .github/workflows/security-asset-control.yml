name: Security asset control

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/security-asset-control.yml
      - scripts/check_security.py
      - scripts/check_security_control.py
      - Makefile
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-asset-control:
    name: Same-candidate asset control
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.16"
          python-version: "3.13"
      - name: Capture isolated candidate assets
        env:
          CAMPUSCLAW_SECURITY_ASSETS: reports/security-control-source
        run: uv run --locked python scripts/check_pytest.py -q tests/integration/test_compose.py -k security_precheck
      - name: Run the real gate before and after removing the fixture
        run: uv run --locked python scripts/check_security_control.py reports/security-control-source
