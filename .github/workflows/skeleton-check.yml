name: Skeleton check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "change/**"]

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.16"
          python-version: "3.13"
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.0
      - name: Run the repository gate
        run: make check
  check-security:
    name: make check-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAMPUSCLAW_SECURITY_ASSETS: reports/ci-security-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.16"
          python-version: "3.13"
      - name: Capture isolated candidate assets and run security regression
        run: uv run --locked python scripts/check_pytest.py -q tests/integration/test_compose.py -k security_precheck
      - name: Run the security gate
        run: make check-security "SECURITY_ASSETS=$CAMPUSCLAW_SECURITY_ASSETS" "SECURITY_CANDIDATE=$GITHUB_SHA"
  build-candidate:
    name: Build candidate images
    needs: [check, check-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.16"
          python-version: "3.13"
      - name: Build and verify the gated revision
        run: uv run --locked python -m scripts.build_candidate "$GITHUB_SHA"
