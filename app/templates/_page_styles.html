  <style nonce="{{ nonce }}">
    :root {
      color-scheme: light;
      --accent: #861d15; --text: #202733; --muted: #505d6c; --line: #d9dde4;
      font: 16px/1.55 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: #f3f4f6; }
    [hidden] { display: none !important; }
    .shell { min-height: 100dvh; display: grid; grid-template-columns: 224px minmax(0,1fr); }
    aside { padding: 24px 16px; background: #fff; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 20px; margin-bottom: 24px; }
    .mark { display: grid; place-items: center; width: 40px; height: 40px; background: var(--accent); border-radius: 12px; }
    nav { display: grid; gap: 8px; }
    a { color: var(--accent); }
    nav a { padding: 8px 12px; border-radius: 8px; color: var(--text); text-decoration: none; }
    nav a[aria-current=page] { background: #f4e5e3; color: var(--accent); font-weight: 700; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); background: white; }
    .identity { display: flex; align-items: center; gap: 8px; }
    .identity span, .muted { color: var(--muted); }
    main { max-width: 1100px; margin-inline: auto; padding: 32px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 28px; }
    h2 { font-size: 20px; }
    .card { padding: 24px; margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 2px 4px #2027330a; }
    form, label { display: grid; gap: 8px; }
    form { gap: 16px; }
    input, textarea, button, select { font: inherit; padding: 8px 12px; border: 1px solid #aab2bf; border-radius: 8px; background: #fff; color: inherit; min-width: 0; }
    textarea { resize: vertical; min-height: 120px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .7; cursor: wait; }
    :focus-visible { outline: 3px solid #3567aa; outline-offset: 3px; }
    .row, .pagination { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row { justify-content: space-between; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { display: grid; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f6f7f9; padding: 16px; border-radius: 8px; }
    .status { margin-top: 16px; min-height: 1.55em; }
    .error { color: var(--accent); }
    .pagination { margin-top: 16px; }
    .api-console { min-width: 0; overflow-wrap: anywhere; }
    .api-console input, .api-console textarea, .api-console select { display: block; width: 100%; max-width: 100%; }
    @media (max-width: 767px) {
      .shell { grid-template-columns: 1fr; }
      aside, header, main { padding: 16px; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { margin-bottom: 8px; }
      nav { display: flex; flex-wrap: wrap; }
      .card { padding: 16px; }
    }
  </style>
